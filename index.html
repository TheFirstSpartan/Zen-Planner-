<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zen Planner - Arcade Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        :root {
            --neon-green: #39ff14;
            --arcade-black: #050505;
        }

        body {
            background-color: var(--arcade-black);
            color: var(--neon-green);
            font-family: 'VT323', monospace;
            text-transform: uppercase;
            overflow-x: hidden;
        }

        /* Scanline Effect */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }

        .arcade-border {
            border: 4px solid var(--neon-green);
            box-shadow: 0 0 15px var(--neon-green);
        }

        .btn-press:active {
            transform: scale(0.95);
            background-color: var(--neon-green);
            color: black;
        }
    </style>
</head>
<body class="p-4">
    <div class="max-w-md mx-auto">
        <header class="arcade-border p-4 mb-6 text-center">
            <h1 class="text-4xl tracking-widest">ZEN PLANNER</h1>
            <p class="text-sm mt-2">v1.0 - INSERT TASKS</p>
        </header>

        <div class="mb-6">
            <input type="text" id="taskInput" placeholder="ENTER NEW GOAL..." 
                   class="w-full bg-black border-2 border-green-500 p-3 text-2xl outline-none focus:bg-zinc-900 text-green-400">
            <button onclick="addTask()" 
                    class="w-full mt-2 bg-green-900 border-2 border-green-500 p-2 text-xl btn-press">
                ADD TO QUEUE
            </button>
        </div>

        <ul id="taskList" class="space-y-4">
            </ul>
    </div>

    <script>
        function addTask() {
            const input = document.getElementById('taskInput');
            const list = document.getElementById('taskList');
            
            if (input.value.trim() === '') return;

            const li = document.createElement('li');
            li.className = "arcade-border p-4 flex justify-between items-center bg-zinc-900 animate-pulse";
            li.innerHTML = `
                <span class="text-xl">${input.value}</span>
                <button onclick="this.parentElement.remove()" class="text-red-500 border border-red-500 px-2">X</button>
            `;
            
            list.appendChild(li);
            input.value = '';
            
            // Remove pulse after animation
            setTimeout(() => li.classList.remove('animate-pulse'), 1000);
        }

        // Allow "Enter" key to add task
        document.getElementById('taskInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') addTask();
        });
    </script>
</body>
</html>
